; ============================================================================
; wfo_slice.ini - sample headless walk-forward-optimization tester config (MI-005)
; ============================================================================
; TEMPLATE for running terminal64.exe /config:wfo_slice.ini on the trading
; machine. Adjust Expert/Login/Symbol/periods/dates to the deployment. The
; EA's OnTester() returns the genetic fitness (see AdaptiveBreakoutAI.mq5):
;   (PF * RF) / max(MaxDD, 0.001), rejecting runs with < 20 trades or
;   MaxDD >= 4.5% (day-reset HWM drawdown - same semantics as the live rail).
;
; Usage:
;   terminal64.exe /config:"<repo>\configs\tester\wfo_slice.ini"
; The Strategy Tester report XML (OptimizationResult.xml / Report.xml) will
; contain a "Custom" column with the fitness; rejected runs show -1.0.
; ============================================================================

[Tester]
Expert=AdaptiveBreakoutAI
Symbol=EURUSD
Period=H1
Model=0
; FromDate=2024.01.01
; ToDate=2024.12.31
; Optimization=1          ; 0=disabled (single run), 1=slow complete, 2=fast genetic
; OptimizationCriterion=6 ; 6 = Custom max (uses OnTester fitness)
; Sleep=0
; ShutdownTerminal=1
; Report=wfo_slice
; UseDate=1
